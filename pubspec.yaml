name: pulse
description: "Пульс — афиша тусовок, концертов и мероприятий в Минске."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Maps
  yandex_maps_mapkit_lite: ^4.41.0
  geolocator: ^13.0.2

  # Storage
  shared_preferences: ^2.3.4

  # UI helpers
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  firebase_messaging: ^16.4.3
  socket_io_client: ^3.1.6
  share_plus: ^13.2.1
  record: ^6.0.0
  audioplayers: ^6.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  phosphor_flutter: ^2.1.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  photo_manager: ^3.12.0
  camera: ^0.12.0+2
  image: ^4.8.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# path_provider_foundation >=2.5.0 / >=2.6.0 pulls in package:objective_c
# (native-assets FFI). That framework is built without DWARF, so App Store
# upload warns/fails with missing dSYM, and on some toolchains dlopen breaks
# CachedNetworkImage. Pin to the last platform-channel implementation.
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: PulseBrand
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appicon_source.png"
  remove_alpha_ios: true
